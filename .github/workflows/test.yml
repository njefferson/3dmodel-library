name: Tests

# The suite exists so the things nobody can check by eye stay checked: that an
# interrupted write cannot damage the catalog, that an online-only file is never
# handed to the renderer, that relocate does not duplicate a kit, that both
# menus only call flags the tool really has.
#
# It runs on WINDOWS as well as Linux, and that is the point of this file rather
# than an afterthought. This is a Windows-first tool whose Windows-specific
# paths — the shell thumbnail engine, the cloud-placeholder attribute check,
# spawn-based multiprocessing, CRLF, drive letters — could not be executed at
# all while it was being written. Everything here was developed on Linux.
#
# Runs on the working branches too, not just main: this repo develops on
# claude/**, and a gate that only watches main is a gate that never runs until
# after the merge that needed it.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false          # a Windows-only failure must not hide a Linux one
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25         # the render tests really render; they should not hang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config makes it
          # available to every later step, including whichever action somebody
          # adds next year. zizmor calls this artipacked.
          persist-credentials: false

      # No actions/setup-python, so no Python-version matrix: pinning an action
      # by SHA means having a verified SHA, and one could not be obtained for
      # setup-python when this was written. An unpinned tag was not an option in
      # the same change that adds a workflow audit for exactly that. The runners'
      # preinstalled Python is used instead.
      #
      # WHAT THIS DOES NOT COVER: README claims Python 3.9+, and nothing here
      # tests the floor. To close that, add setup-python with a real SHA pin and
      # a python-version matrix of ["3.9", "3.x"].
      - name: Python version under test
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Everything: the fixture catalogs, the real renders, the process pool,
      # the CAD reader, and both menus checked against the argument parser.
      - name: Test suite
        run: python -m unittest discover -s tests -v
